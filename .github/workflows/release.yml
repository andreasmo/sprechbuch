name: Release

# Baut die Desktop-App für Windows, macOS und Linux, sobald ein Versions-Tag (v0.1.0 …) gepusht wird,
# und legt die Installer in einem Entwurf der Release ab. Veröffentlicht wird der Entwurf von Hand.
# Die Installer sind nicht signiert (macOS: nur ad hoc, damit die App auf Apple-Silicon startet).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Älteres Ubuntu, damit AppImage und .deb auch auf älteren Distributionen laufen
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tauri-Systembibliotheken
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Sprechbuch ${{ github.ref_name }}
          releaseBody: Installer für Windows, macOS und Linux – Beschreibung folgt.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
