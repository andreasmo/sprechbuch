name: Lese-App (GitHub Pages)

# Baut die Lese-App (ohne Import und KI) und veröffentlicht sie auf GitHub Pages.
# Auf der Seite liegt nur der Code der App – Bücher bleiben immer auf dem Gerät.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/core/**"
      - "examples/**"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @sprechbuch/core
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
